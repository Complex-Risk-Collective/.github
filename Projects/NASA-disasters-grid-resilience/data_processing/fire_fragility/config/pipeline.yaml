# =====================================================================
# Wildfire conductor-rating pipeline configuration
# Entry point: python run_rating_pipeline.py --config config/pipeline.yaml
#
# Relative paths resolve against THIS file's directory. Absolute paths
# are used below so the file can live anywhere.
# Markers:  REQUIRED = must be replaced before a defensible run
#           REVIEW   = working assumption; confirm or replace
# =====================================================================

project:
  # Scripts default to the directory containing run_rating_pipeline.py.
  # script_directory: /path/to/fire_fragility
  work_directory: /mnt/data1/MultiHazard/fragility/work

grid:
  # Output grid for every raster product (CRS, transform, shape).
  template_raster: /mnt/data1/MultiHazard/fragility/data/template.tif

pipeline:
  # Set false to reuse outputs that already exist.
  prepare_pyretechnics_outputs: true
  download_era5: false
  extract_era5: false

analysis:
  # timestamp_matched: fire raster at the rating hour
  # event_maximum:     per-cell maximum over the whole simulation
  fire_mode: timestamp_matched
  fire_percentile: 99
  rating_timestamp_utc: 
  # fixed:        use rating_timestamp_utc above.
  # fire_arrival: stage 5 reads time_of_arrival at the conductor cells and
  #               selects the rating hour (rating_timestamp_utc is then
  #               only a dry-run placeholder). See fire_arrival below.
  # --rating-timestamp-utc on the command line overrides both.
  rating_time_source: fire_arrival

# ---------------------------------------------------------------------
# Fire inputs (read directly by prepare_pyretechnics_outputs.py)
# ---------------------------------------------------------------------
pyretechnics_outputs:
  root_directory: /mnt/data1/MultiHazard/fragility/data/previous_run_lc_fire/fresno-june-lc-run-nlahaye_20240626_120000_exporter_f1cb179721adebd1896a9f1a4561848f/pyretechnics-deck/
  output_directory: /mnt/data1/MultiHazard/fragility/work/fire_prepared
  simulation_start_utc: "2024-06-26T00:00:00Z"
  # _001 = simulation start + 0 h
  hour_semantics: one_based_index
  filename_regex: >-
    ^(?P<parameter>.+)_(?P<percentile>\d{1,3})_(?P<hour>\d+)\.(?:tif|tiff)$
  selected_percentiles: [99]
  unknown_parameter_action: warn
  write_standardized_inputs: true
  derive_fireline_intensity: true
  write_percentile_event_maximum: true
  manifest_filename: pyretechnics_output_manifest.csv
  parameters:
    flame-length:
      canonical_name: flame_length
      input_units: m
      output_units: m
      resampling: nearest
      reject_negative: true
    spread-rate:
      canonical_name: spread_rate
      input_units: m/min
      output_units: m/min
      resampling: nearest
      reject_negative: true
    crown-fire:
      canonical_name: crown_fire
      input_units: category
      output_units: category
      resampling: nearest
      reject_negative: true
    time-of-arrival:
      canonical_name: time_of_arrival
      input_units: hours_since_initialization
      output_units: hours_since_initialization
      resampling: nearest
      reject_negative: false
      # Keep unburned cells as nodata (Pyretechnics writes NaN). With the
      # default zero fill, unburned would read as "arrival at minute 0".
      fill_value: nodata
    hours-since-burned:
      canonical_name: hours_since_burned
      input_units: hours
      output_units: hours
      resampling: nearest
      reject_negative: false
    isochrones:
      canonical_name: isochrones
      input_units: model_value
      output_units: model_value
      resampling: nearest
      reject_negative: false

# ---------------------------------------------------------------------
# Weather
# ---------------------------------------------------------------------
era5:
  bbox: {north: 37.0, west: -119.5, south: 36.5, east: -119.0}
  compression_level: 4
  keep_grib: false

# ---------------------------------------------------------------------
# Fire arrival at the conductor (stage 5; used when
# analysis.rating_time_source: fire_arrival or time_series.source: arrival)
# ---------------------------------------------------------------------
fire_arrival:
  # Percentile of the time_of_arrival rasters. Defaults to
  # analysis.fire_percentile. REVIEW: a high percentile of arrival time is
  # a LATE arrival; a low percentile (e.g. 1) gives an early, conservative
  # arrival hour.
  # percentile: 99
  # Clock origin of time_of_arrival; defaults to simulation_start_utc.
  # reference_time_utc: "2024-06-26T00:00:00Z"
  # Units default to parameters.time-of-arrival.output_units.
  # units: min
  statistic: first        # first | median | last over conductor cells
  rounding: ceil          # ceil | floor | nearest to an available fire hour
  offset_hours: 0         # shift the target, e.g. +1 for one hour after arrival

# Optional: defaults for run_rating_time_series.py (command-line flags override).
# time_series:
#   source: fire              # fire | era5 | range | list | arrival
#   start_utc: null           # optional bounds, e.g. 2024-06-26T00:00:00Z
#   end_utc: null
#   step_hours: 1             # range source
#   times_utc: []             # list source
#   arrival_window_hours: [0, 3]   # arrival source: hours before, after
#   jobs: 1
#   continue_on_error: true
#   write_stacks: true
#   output_subdirectory: time_series

# ---------------------------------------------------------------------
# Conductor (endpoints section read by prepare_conductor_input.py)
# ---------------------------------------------------------------------
conductors:
  source_type: endpoints            # endpoints | vector
  prepared_vector: /mnt/data1/MultiHazard/fragility/work/conductor_input/conductors.gpkg
  prepared_layer: conductors
  line_id_field: line_id

  endpoints:
    crs: EPSG:4326
    p1: {lon: -119.270386, lat: 36.790082}
    p2: {lon: -119.243271, lat: 36.783687}

    line_id: conductor_001
    height_m: 50.0                  # REVIEW: attachment/sag-point height AGL
    diameter_m:                     # REQUIRED (falls back to defaults)
    solar_absorptivity: 0.3         # REVIEW
    emissivity: 0.32                # REVIEW

  vector:
    path: null
    layer: null
    line_id_field: line_id
    height_field: height_m
    diameter_field: diameter_m
    absorptivity_field: solar_abs
    emissivity_field: emissivity
    default_height_m: null
    default_diameter_m: null
    default_absorptivity: null
    default_emissivity: null

  # Used when a per-feature value is missing.
  defaults:
    diameter_m: 0.03                # REVIEW: manuscript case-study value
    solar_absorptivity: 0.3         # REVIEW
    emissivity: 0.32                # REVIEW

  all_touched: true
  center_only_for_fire_intersection: false

conductor_elevation:
  # dem:   terrain(DEM) + conductor_height_m.tif (per cell)
  # value: use value_m everywhere (metres above MSL)
  source: dem
  value_m: null
  dem: /mnt/data1/MultiHazard/fragility/data/previous_run_lc_fire/fresno-june-lc-run-nlahaye_20240626_120000_exporter_f1cb179721adebd1896a9f1a4561848f/input-deck/dem.tif
  dem_vertical_units: m             
  dem_vertical_datum: NAVD88        
  resampling: bilinear
  allow_partial_coverage: false
  # raster: pass the per-cell elevation raster to the rating
  # scalar: pass one number (scalar_statistic over conductor cells)
  use_as: raster
  scalar_statistic: mean

# ---------------------------------------------------------------------
# Physics
# ---------------------------------------------------------------------
wildfire_heat:
  convective_coefficient: 1.3 #0.1
  radiative_fraction: 0.3 #Informed guess for Fresno case
  # Geometry scalars. Used directly when fire_geometry.enabled is false,
  # and as fallbacks (per line) when stage 9 cannot determine a value.
  fire_front_length_m: 100.0        # L
  ground_offset_m: 0.0              # y
  fire_normal_angle_deg: 0.0        # alpha_f: fire front vs conductor;
                                    # 0 = front parallel to the line

# ---------------------------------------------------------------------
# Fire geometry at the line (stage 9, compute_fire_conductor_angle.py).
# Derives alpha_f, y and L per line from Pyretechnics time_of_arrival
# (requires time-of-arrival with fill_value: nodata in stage 1).
# ---------------------------------------------------------------------
fire_geometry:
  enabled: true
  apply_to_heat:                    # false = keep the wildfire_heat scalar
    fire_normal_angle_deg: true
    ground_offset_m: true
    fire_front_length_m: true
  gradient_window_cells: 3          # odd; local plane fit to time of arrival
  minimum_valid_neighbours: 6
  front_window_minutes: 60          # REVIEW: arrival band defining "the front"
  search_radius_m: 1500              # REVIEW: caps L at about 2x this value
  # offset_mode: active_front       # active_front | zero (default zero in
  #                                 # event_maximum mode)
  # percentile: 99                  # defaults to fire_arrival.percentile

wind:
  method: power                     # power | log
  power_exponent: 0.142857          # REVIEW: 1/7 neutral open-terrain law
  roughness_length_m: null          # number or raster; log method only
  calm_threshold_m_s: 0.1
  calm_wind_policy: natural         # natural | nodata

solar:
  diffuse_model: isotropic-cylinder # isotropic-cylinder | none
  minimum_solar_elevation_deg: 3.0
  max_dni_w_m2: null
  # ERA5 radiation at time T is the mean over (T-1h, T]; evaluate the sun
  # at the window midpoint.
  geometry_time_offset_minutes: -30
  # off: manuscript assumption (smoke blocks the sun during fire)
  # on:  wildfire case keeps the baseline solar gain
  wildfire_case: "off"

rating:
  maximum_surface_temperature_c: 75.0   # REVIEW: conductor MOT
  average_strand_temperature_c: 75.0    # REVIEW
  resistance:                           # REQUIRED: AC resistance points
    low_temperature_c: null
    low_resistance_ohm_m: null
    high_temperature_c: null
    high_resistance_ohm_m: null
